services:
  app:
    build: .
    container_name: fac-app
    ports:
      - "9094:9094"
    environment:
      - APP_PASSWORD=${APP_PASSWORD:-}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-fac}:${POSTGRES_PASSWORD:-fac}@db:5432/${POSTGRES_DB:-fac}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: fac-db
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-fac}
      - POSTGRES_USER=${POSTGRES_USER:-fac}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-fac}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fac} -d ${POSTGRES_DB:-fac}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
